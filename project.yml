name: Entailler
options:
  bundleIdPrefix: com.maciejwiatr
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  NotchCore:
    path: Packages/NotchCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Entailler:
    type: application
    platform: macOS
    sources: [Entailler]
    dependencies:
      - package: NotchCore
      # Loaded by /usr/bin/perl rather than by the app, so it is only embedded.
      - target: EntaillerMediaRemote
        link: false
        embed: true
        codeSign: true
        copy:
          destination: frameworks
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maciejwiatr.entailler
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Entailler
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # Xcode drops INFOPLIST_KEY_NSAudioCaptureUsageDescription, so the System Audio Recording
        # prompt's text comes from a partial Info.plist merged into the generated one.
        INFOPLIST_FILE: Entailler/Info.plist
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: Entailler shows your upcoming events in the Notch and lets you join their calls.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Entailler shows your to-dos from Reminders in the Notch and lets you tick them off and add new ones.
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Entailler selects the Terminal or iTerm2 tab a Claude Code session runs in when you open it from the Notch.
        # A stable signing identity keeps the Accessibility grant, which the volume and
        # brightness keys need, across rebuilds. Ad-hoc signatures change with every build.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: ZT5YR566L2
        ENABLE_HARDENED_RUNTIME: NO
  EntaillerMediaRemote:
    type: library.dynamic
    platform: macOS
    sources: [Helpers/MediaRemote]
    settings:
      base:
        CLANG_ENABLE_OBJC_ARC: YES
        # Signed like the app it's embedded in.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: ZT5YR566L2
        SKIP_INSTALL: YES
schemes:
  Entailler:
    build:
      targets:
        Entailler: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: NotchCore/NotchCoreTests
